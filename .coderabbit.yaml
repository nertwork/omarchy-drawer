# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  poem: true

  labeling_instructions:
    - label: "bug"
      instructions: "Apply when the PR fixes a bug, race condition, UI glitch, or crash."
    - label: "enhancement"
      instructions: "Apply when the PR introduces a new feature, telemetry metric, or UI improvement."
    - label: "ui/qml"
      instructions: "Apply when QML / Quickshell UI components or theme bindings are modified."
    - label: "wayland/hyprland"
      instructions: "Apply when Wayland, Hyprland, Omarchy shell, or bar widget integration is modified."
    - label: "security"
      instructions: "Apply when credential handling, token permissions, or Zero-PII rules are touched."
    - label: "documentation"
      instructions: "Apply when README.md or documentation files are modified."
    - label: "ci/cd"
      instructions: "Apply when .github/workflows/** or .coderabbit.yaml are modified."

  path_instructions:
    - path: "**/*.qml"
      instructions: |
        Review Quickshell / QtQuick QML components for:
        1. Non-blocking Process / timer execution and clean signal handlers.
        2. Dynamic Omarchy theme compatibility (colors.toml palette bindings).
        3. Responsive popup and bar pill sizing without text clipping.
    - path: "**/*.{py,sh}"
      instructions: |
        Review helper scripts for:
        1. Explicit timeouts on subprocess and network calls.
        2. Strict 0600 permissions on any token/cache files and zero hardcoded secrets or personal data (PII).
        3. Graceful fallback when optional CLI tools or network interfaces are offline.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
